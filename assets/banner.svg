<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dynamic Gradient Definitions -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#9b51e0;#00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#9b51e0;#00f2fe;#4facfe" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes badgeHover {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .floating-shield {
      animation: float 4s ease-in-out infinite;
      transform-origin: center;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite;
    }
    .badge {
      transition: all 0.3s;
    }
    .text-title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .text-subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs -->
  <circle cx="200" cy="100" r="180" fill="#00f2fe" opacity="0.08" class="pulse-circle" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="160" fill="#9b51e0" opacity="0.08" class="pulse-circle" filter="url(#glow)" />
  <circle cx="600" cy="200" r="120" fill="#10b981" opacity="0.05" class="pulse-circle" filter="url(#glow)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#cyanPurpleGrad)" />

  <!-- Shield Icon Graphic -->
  <g class="floating-shield" transform="translate(120, 140)">
    <circle cx="60" cy="60" r="60" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="2" />
    <path d="M 60 25 L 90 40 V 65 C 90 85 60 100 60 100 C 60 100 30 85 30 65 V 40 Z" fill="url(#emeraldGrad)" opacity="0.9" />
    <path d="M 48 60 L 56 68 L 74 50" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Titles -->
  <g transform="translate(280, 130)">
    <text x="0" y="30" fill="url(#cyanPurpleGrad)" class="text-title" font-size="44" filter="url(#glow)">Awesome Product Compliance</text>
    <text x="0" y="70" fill="#e2e8f0" class="text-subtitle" font-size="20">SaaS Platforms &amp; Open-Source Ecosystem for Regulatory Governance</text>
    <text x="0" y="102" fill="#94a3b8" class="text-subtitle" font-size="15">RoHS • REACH • SCIP • PFAS • PLM • BOM Management • ESG &amp; Sustainability</text>
  </g>

  <!-- Tag Badges -->
  <g transform="translate(280, 275)">
    <!-- Badge 1: RoHS / REACH -->
    <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5" />
    <text x="65" y="20" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">✓ RoHS &amp; REACH</text>

    <!-- Badge 2: SCIP / PFAS -->
    <rect x="145" y="0" width="125" height="32" rx="16" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1.5" />
    <text x="207" y="20" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ SCIP &amp; PFAS</text>

    <!-- Badge 3: PLM & BOM -->
    <rect x="285" y="0" width="130" height="32" rx="16" fill="rgba(155, 81, 224, 0.15)" stroke="#9b51e0" stroke-width="1.5" />
    <text x="350" y="20" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚙️ PLM &amp; BOMs</text>

    <!-- Badge 4: Open Source -->
    <rect x="430" y="0" width="145" height="32" rx="16" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="502" y="20" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">🚀 35+ Open Source</text>

    <!-- Badge 5: SaaS Directory -->
    <rect x="590" y="0" width="135" height="32" rx="16" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="1.5" />
    <text x="657" y="20" fill="#f472b6" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">📊 SaaS Benchmarks</text>
  </g>
</svg>
